[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-eval-bench"
version = "0.1.0"
description = "A reproducible bench for retrieval-augmented generation pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "frontedge[serve]>=0.5,<0.6",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]
retrieval = [
    "sentence-transformers>=3",
]

[project.scripts]
rag-eval-bench = "rag_eval_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
